name: Release
on:
  push:
    tags: ['v*']
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release name
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then T="$GITHUB_REF_NAME"; else T="latest"; fi
          echo "TAG=$T" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio esptool==4.7.0
      - name: Build firmware
        run: |
          pio run
          mkdir -p dist
          B=.pio/build/esp32dev
          A=$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          V=$(grep -o '#define FW_VERSION "[^"]*"' firmware/esp32-node/esp32-node.ino | cut -d'"' -f2)
          esptool.py --chip esp32 merge_bin -o "dist/ibn-firmware-$V-full.bin" --flash_mode dio --flash_freq 40m --flash_size 4MB 0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 $A 0x10000 $B/firmware.bin
          cp $B/firmware.bin "dist/ibn-firmware-$V-ota.bin"
      - name: Java for APK
        if: github.event.repository.private == true || vars.INCLUDE_APK == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Gradle for APK
        if: github.event.repository.private == true || vars.INCLUDE_APK == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build APK
        if: github.event.repository.private == true || vars.INCLUDE_APK == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "FAILED: signing key secret missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ibn.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/ibn.jks"
          gradle assembleDebug --console=plain
          cp app/build/outputs/apk/debug/*.apk "dist/IbnEIlyasHome-$TAG.apk"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          { echo "Built from commit $(echo "$GITHUB_SHA" | cut -c1-7) on $(date -u '+%Y-%m-%d %H:%M') UTC"; echo; cat RELEASE_NOTES.md; } > notes.md
          if [ "$TAG" = "latest" ]; then
            gh release delete latest --cleanup-tag --yes || true
            TITLE="Latest build (main)"
          else
            TITLE="Ibn e Ilyas Home $TAG"
          fi
          gh release create "$TAG" dist/* --title "$TITLE" --notes-file notes.md --target "$GITHUB_SHA"
