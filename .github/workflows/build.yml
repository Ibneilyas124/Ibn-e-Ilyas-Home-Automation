name: Build APK
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "FAILED: signing key secret missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ibn.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ibn.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleDebug --console=plain > build.log 2>&1
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong" -A4 build.log | head -40 || true
          tail -n 30 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: IbnEIlyasHome-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Voice tests
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle testDebugUnitTest --console=plain > test.log 2>&1
      - name: Show test failures
        if: failure() && hashFiles('test.log') != ''
        run: |
          grep -E "FAILED|AssertionError" -A3 test.log | head -60 || true
          tail -n 20 test.log
