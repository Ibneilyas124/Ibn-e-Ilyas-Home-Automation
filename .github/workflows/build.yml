name: Build APK
on:
  push:
    branches: [develop, main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build firmware for the app
        run: |
          pip install platformio esptool==4.7.0
          pio run
          B=.pio/build/esp32dev
          A=$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin
          mkdir -p app/src/main/assets
          esptool.py --chip esp32 merge_bin -o app/src/main/assets/firmware-full.bin --flash_mode dio --flash_freq 40m --flash_size 4MB 0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 $A 0x10000 $B/firmware.bin
          grep -o '#define FW_VERSION "[^"]*"' firmware/esp32-node/esp32-node.ino | cut -d'"' -f2 > app/src/main/assets/firmware-version.txt
          [ "$(wc -c < app/src/main/assets/firmware-full.bin)" -gt 500000 ] || { echo "FAILED: firmware bundle chhota hai"; exit 1; }
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "FAILED: signing key secret missing"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ibn.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ibn.jks" >> "$GITHUB_ENV"
      - name: Build
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle assembleDebug --console=plain > build.log 2>&1
      - name: Show errors
        if: failure()
        run: |
          grep -E "^e: |What went wrong" -A4 build.log | head -40 || true
          tail -n 30 build.log
      - uses: actions/upload-artifact@v4
        with:
          name: IbnEIlyasHome-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Voice tests
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle testDebugUnitTest --console=plain > test.log 2>&1
      - name: Show test failures
        if: failure() && hashFiles('test.log') != ''
        run: |
          grep -E "FAILED|AssertionError" -A3 test.log | head -60 || true
          tail -n 20 test.log
